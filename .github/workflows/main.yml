name: Build A510CarPlayProbe

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build rootless package
        run: |
          export THEOS=$HOME/theos
          make clean
          make package FINALPACKAGE=1

      - name: Show packages
        run: |
          find packages -type f -maxdepth 2 -print || true

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: A510CarPlayProbe-DEB
          path: packages/*.deb
